<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="andinoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mountainSnow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#andinoSky)"/>
  <!-- Mountain silhouette back -->
  <polygon points="40,240 160,80 260,240" fill="#334155" opacity="0.6"/>
  <!-- Main Peak Huascarán / Cordillera Blanca -->
  <polygon points="120,240 240,40 370,240" fill="#1e293b"/>
  <!-- Snow Cap -->
  <polygon points="205,95 240,40 275,95 255,85 240,105 220,85" fill="url(#mountainSnow)"/>
  <!-- Mountain front peak -->
  <polygon points="0,240 100,120 220,240" fill="#0f172a"/>
  <polygon points="70,155 100,120 130,155 115,150 100,165 85,150" fill="url(#mountainSnow)"/>
  <!-- Glacier Lagoon / Siembra y Cosecha de agua -->
  <ellipse cx="200" cy="225" rx="140" ry="25" fill="#06b6d4" opacity="0.8"/>
  <ellipse cx="200" cy="225" rx="100" ry="16" fill="#67e8f9" opacity="0.7"/>
  <!-- Telemetry sensor icon -->
  <circle cx="240" cy="40" r="5" fill="#10b981"/>
  <line x1="240" y1="40" x2="240" y2="25" stroke="#10b981" stroke-width="2"/>
  <circle cx="240" cy="23" r="2" fill="#ef4444"/>
  <!-- Tag -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
  <text x="30" y="38" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">PERÚ · ANDES</text>
</svg>
