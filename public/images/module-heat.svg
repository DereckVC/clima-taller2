<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="16" fill="#201008"/>
  <!-- Sun and intense heat radiation -->
  <circle cx="60" cy="50" r="22" fill="#ea580c"/>
  <circle cx="60" cy="50" r="32" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Arid cracked ground line -->
  <path d="M20 95 L40 90 L55 96 L70 88 L90 94 L100 90" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
  <!-- Thermometer icon -->
  <line x1="60" y1="35" x2="60" y2="60" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
</svg>
