<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="globalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#globalBg)"/>
  <!-- Concentric Radar Alert Waves -->
  <circle cx="200" cy="130" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>
  <circle cx="200" cy="130" r="80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="130" r="50" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="130" r="20" fill="#38bdf8" opacity="0.3"/>
  <circle cx="200" cy="130" r="8" fill="#38bdf8"/>
  <!-- Broadcast towers / nodes -->
  <line x1="80" y1="180" x2="120" y2="140" stroke="#10b981" stroke-width="2"/>
  <circle cx="80" cy="180" r="5" fill="#10b981"/>
  <line x1="320" y1="180" x2="280" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="320" cy="180" r="5" fill="#f59e0b"/>
  <!-- Tag -->
  <rect x="20" y="20" width="150" height="28" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#6366f1" stroke-width="1"/>
  <text x="30" y="38" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="700">INICIATIVA OMM / ONU</text>
</svg>
